<title>המערכת של אדם</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a single reading column; a day strip like a departures board, then lesson cards keyed by period. */
:root {
  --bg: #f2f4f5; --surface: #ffffff; --ink: #15212b; --muted: #5a6773; --line: #d8dee3;
  --accent: #1d5fa8; --accent-soft: #e2ecf8; --accent-ink: #ffffff;
  --warn: #9a5800; --warn-soft: #fbefd8; --bad: #b3261e; --bad-soft: #f9e2e0;
  --font-body: "IBM Plex Sans Hebrew", "Segoe UI", Arial, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f151b; --surface: #17212a; --ink: #e5ebf0; --muted: #94a2ae; --line: #2a3641;
  --accent: #7db4f0; --accent-soft: #1a2d43; --accent-ink: #0f151b;
  --warn: #f0b45c; --warn-soft: #3a2a12; --bad: #f28b82; --bad-soft: #3d1e1c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f151b; --surface: #17212a; --ink: #e5ebf0; --muted: #94a2ae; --line: #2a3641;
  --accent: #7db4f0; --accent-soft: #1a2d43; --accent-ink: #0f151b;
  --warn: #f0b45c; --warn-soft: #3a2a12; --bad: #f28b82; --bad-soft: #3d1e1c; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.wrap > *, .wrap section > * { min-width: 0; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.05rem; font-weight: 600; }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
button:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: grid; gap: 4px; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .85rem; color: var(--muted); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tabs button { white-space: nowrap; }
.tabs button { background: none; border: 0; padding: 8px 12px; cursor: pointer; color: var(--muted); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.now { background: var(--accent); color: var(--accent-ink); border-radius: var(--r); padding: 14px 16px; display: grid; gap: 10px; }
.now .slot { display: grid; gap: 2px; }
.now .k { font-size: .74rem; font-weight: 600; letter-spacing: .06em; opacity: .85; }
.now .s { font-size: 1.12rem; font-weight: 700; }
.now .d { font-size: .88rem; opacity: .92; }
.now .slot + .slot { border-top: 1px solid color-mix(in srgb, var(--accent-ink) 30%, transparent); padding-top: 10px; }
.agenda { display: grid; gap: 8px; }
.ag { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; display: grid; gap: 4px; font-size: .9rem; }
.ag.hit { border-color: var(--warn); }
.ag .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.ag .kind { font-size: .74rem; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.ag .kind.exam { background: var(--warn-soft); color: var(--warn); }
.ag .hitline { color: var(--warn); font-weight: 600; font-size: .84rem; }
.ends { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 14px; display: grid; gap: 6px; }
.ends h3 { font-size: .9rem; font-weight: 600; }
.ends table { border-collapse: collapse; width: 100%; font-size: .88rem; }
.ends td { padding: 4px 0; border-top: 1px solid var(--line); }
.ends tr:first-child td { border-top: 0; }
.ends td.t { font-family: var(--font-mono); font-weight: 600; text-align: end; white-space: nowrap; }
.ends .diff { color: var(--warn); font-weight: 600; font-size: .8rem; }
.daydate { font-size: .8rem; font-weight: 600; color: var(--muted); margin-top: 6px; }
.alerts { background: var(--warn-soft); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 6px; }
.alerts h2 { color: var(--warn); font-size: .95rem; }
.alerts ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 2px; font-size: .9rem; }
.calm { font-size: .88rem; color: var(--muted); }

.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.strip button { flex: 0 0 auto; display: grid; gap: 0; justify-items: center; min-width: 62px; padding: 7px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); cursor: pointer; }
.strip .wd { font-size: .78rem; color: var(--muted); }
.strip .dm { font-family: var(--font-mono); font-weight: 600; font-size: .95rem; }
.strip .n { font-size: .72rem; color: var(--muted); white-space: nowrap; }
.strip button.today .wd::after { content: " · היום"; color: var(--accent); }
.strip button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); }
.strip button[aria-pressed="true"] * { color: var(--accent-ink); }
.strip button.off { opacity: .55; }
.strip .gap { flex: 0 0 1px; background: var(--line); margin-inline: 4px; }

.dayhead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.holiday { background: var(--bad-soft); color: var(--bad); border-radius: 8px; padding: 8px 12px; font-weight: 600; font-size: .9rem; }

.lessons { display: grid; gap: 10px; }
.lesson { display: grid; grid-template-columns: 92px minmax(0, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.lesson.changed { border-color: var(--warn); }
.lesson.cancelled { border-color: var(--bad); }
.lesson.cancelled .when { background: var(--bad-soft); }
.lesson.cancelled .when .per { color: var(--bad); }
.lesson.cancelled .what h3 { text-decoration: line-through; color: var(--muted); }
.off-tag { color: var(--bad); font-weight: 700; font-size: .8rem; }
table.week td.slot.cancelled { background: var(--bad-soft); }
table.week td.slot.cancelled .s { text-decoration: line-through; }
.when { background: var(--accent-soft); padding: 12px 10px; display: grid; align-content: start; gap: 2px; text-align: center; }
.when .per { font-size: .72rem; font-weight: 600; color: var(--accent); letter-spacing: .04em; }
.when .t { font-family: var(--font-mono); font-size: .95rem; font-weight: 600; }
.when .t2 { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); }
.what { padding: 12px 14px; display: grid; gap: 8px; min-width: 0; }
.what h3 { font-size: 1.02rem; font-weight: 600; }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: .88rem; }
.label { font-size: .74rem; color: var(--muted); font-weight: 600; min-width: 64px; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .82rem; }
.chip.plain { background: transparent; border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.chip .rm { color: var(--muted); font-weight: 400; }
.change { display: flex; gap: 8px; align-items: baseline; background: var(--warn-soft); color: var(--ink); border-radius: 6px; padding: 5px 9px; font-size: .86rem; }
.change b { color: var(--warn); white-space: nowrap; }
.change.bad { background: var(--bad-soft); } .change.bad b { color: var(--bad); }
details { font-size: .86rem; }
summary { cursor: pointer; color: var(--muted); }
details ul { margin: 6px 0 0; padding-inline-start: 18px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; color: var(--muted); }

.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.filters label { display: flex; gap: 6px; align-items: center; font-size: .85rem; color: var(--muted); }
select { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); max-width: 100%; }
.weeknav { display: flex; gap: 6px; }
.weeknav button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: .85rem; }
.weeknav button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.gridwrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table.week { border-collapse: collapse; width: 100%; min-width: 640px; font-size: .8rem; }
table.week th, table.week td { border-bottom: 1px solid var(--line); border-inline-start: 1px solid var(--line); padding: 5px 6px; vertical-align: top; text-align: start; }
table.week th { background: var(--accent-soft); font-weight: 600; white-space: nowrap; }
table.week th.h { width: 54px; font-family: var(--font-mono); font-weight: 500; color: var(--muted); }
table.week td.slot { background: var(--accent-soft); cursor: pointer; }
table.week td.slot.changed { background: var(--warn-soft); }
table.week td.dim { opacity: .35; }
table.week .s { font-weight: 600; display: block; }
table.week th .hol { display: block; font-weight: 500; color: var(--bad); font-size: .72rem; white-space: normal; }
.totals { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .85rem; color: var(--muted); }
.totals b { color: var(--ink); font-family: var(--font-mono); }

.hist { display: grid; gap: 8px; }
.hist details { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; font-size: .9rem; }
.hist summary { color: var(--ink); display: flex; justify-content: space-between; gap: 8px; }
.hist li { margin-block: 2px; }
footer { font-size: .8rem; color: var(--muted); }
@media (max-width: 460px) {
  .lesson { grid-template-columns: 74px minmax(0, 1fr); }
  .label { min-width: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) { .strip button, .tabs button { transition: background-color .15s, color .15s; } }
</style>

<div class="wrap" dir="rtl" lang="he">
  <header>
    <span class="eyebrow">מערכת שעות אישית · טכני חיפה</span>
    <h1 id="who">ארשבסקי אדם</h1>
    <div class="meta" id="meta"></div>
  </header>

  <section id="now" aria-live="polite"></section>

  <section id="alerts"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-day" aria-selected="true" data-view="day">לפי יום</button>
    <button role="tab" id="tab-week" aria-selected="false" data-view="week">שבוע מלא</button>
    <button role="tab" id="tab-agenda" aria-selected="false" data-view="agenda">מבחנים ואירועים</button>
    <button role="tab" id="tab-hist" aria-selected="false" data-view="hist">יומן</button>
  </nav>

  <section id="view-day" class="lessons-view" style="display:grid; grid-template-columns:minmax(0,1fr); gap:14px">
    <div class="strip" id="strip" aria-label="בחירת יום"></div>
    <div class="dayhead"><h2 id="daytitle"></h2><span class="muted" id="daycount"></span></div>
    <div id="dayholiday"></div>
    <div class="agenda" id="dayagenda"></div>
    <div class="lessons" id="daylist"></div>
    <div id="dayends"></div>
  </section>

  <section id="view-week" hidden style="display:grid; grid-template-columns:minmax(0,1fr); gap:12px">
    <div class="filters">
      <div class="weeknav" id="weeknav"></div>
      <label for="f-class">כיתה <select id="f-class"></select></label>
      <label for="f-teacher">מורה שותף <select id="f-teacher"></select></label>
    </div>
    <div class="totals" id="totals"></div>
    <div class="gridwrap"><table class="week" id="weekgrid"></table></div>
  </section>

  <section id="view-agenda" hidden style="display:grid; grid-template-columns:minmax(0,1fr); gap:10px">
    <p class="muted" style="margin:0">מבחנים ואירועים קרובים בכיתות שאתה מלמד בהן. מסומן בכתום מה שנופל על שיעור שלך.</p>
    <div class="agenda" id="agenda"></div>
  </section>

  <section id="view-hist" hidden style="display:grid; grid-template-columns:minmax(0,1fr); gap:10px">
    <p class="muted" style="margin:0">כל יום נשמר כאן לפי הגרסה האחרונה שנבדקה באתר.</p>
    <div class="hist" id="hist"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script id="data" type="application/json">/*__DATA__*/null</script>
<script>
(function () {
  "use strict";
  document.documentElement.dir = "rtl"; document.documentElement.lang = "he";
  var DATA = JSON.parse(document.getElementById("data").textContent || "null");
  if (!DATA) { document.getElementById("daylist").innerHTML = '<div class="empty">אין עדיין נתונים.</div>'; return; }
  var L = DATA.latest, lessons = L.lessons;

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function dm(iso) { var p = iso.split("-"); return p[2] + "." + p[1]; }
  function stamp(ts) { return ts ? dm(ts.slice(0, 10)) + " " + ts.slice(11, 16) : ""; }
  function range(a, b) { return '<bdi dir="ltr">' + esc(a) + "–" + esc(b) + '</bdi>'; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  var todayISO = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Jerusalem" }).format(new Date());
  var hourNow = +new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jerusalem", hour: "2-digit", hour12: false }).format(new Date());
  var BAD = /ביטול|חופשי|מבוטל/;

  document.getElementById("who").textContent = DATA.teacher;
  var when = stamp(L.scraped_at);
  document.getElementById("meta").innerHTML =
    '<span>נבדק: <span class="mono">' + esc(when) + '</span></span>' +
    (L.site_update ? '<span>' + esc(L.site_update) + '</span>' : "") +
    '<span>' + L.class_count + ' כיתות נסרקו</span>';
  document.getElementById("foot").innerHTML = 'המקור: <a href="' + esc(DATA.source) + '" target="_blank" rel="noopener">' + esc(DATA.source) + '</a>';

  // ---- alerts: recent detected changes + change markers on upcoming lessons
  (function () {
    var cutoff = new Date(Date.now() - 3 * 864e5).toISOString().slice(0, 10);
    var recent = (DATA.changelog || []).filter(function (c) { return (c.detected_at || "").slice(0, 10) >= cutoff && (!c.date || c.date >= todayISO); });
    var marks = [];
    lessons.forEach(function (l) {
      if (l.date < todayISO) return;
      if (l.status === "cancelled") marks.push(dm(l.date) + " שעה " + l.hour + " · " + l.subject + " · " + l.classes.join(", ") + " — לא מתקיים" + (l.changes.length ? " (" + l.changes.map(function (c) { return c.text; }).join(", ") + ")" : ""));
      else l.changes.forEach(function (c) { marks.push(dm(l.date) + " שעה " + l.hour + " · " + l.subject + " — " + c.type + ": " + c.text); });
    });
    // A lesson already listed under "changed since the last checks" isn't repeated below.
    var seen = recent.map(function (c) { return c.text; });
    marks = marks.filter(function (m, i) {
      return marks.indexOf(m) === i && !seen.some(function (t) { var p = m.split(" · ")[0].split(" שעה "); return t.indexOf(p[0].split(".").reverse().join("-")) >= 0 && t.indexOf("שעה " + p[1] + " ") >= 0; });
    });
    var tab = (L.class_changes || []).map(function (c) { return c["class"] + ": " + (c.date_label ? c.date_label + " " : "") + c.text; });
    var el = document.getElementById("alerts");
    if (!recent.length && !marks.length && !tab.length) { el.innerHTML = '<p class="calm" style="margin:0">אין שינויים במערכת שלך בימים הקרובים.</p>'; return; }
    var h = '<div class="alerts">';
    if (recent.length) h += '<h2>השתנה מאז הבדיקות הקודמות</h2><ul>' + recent.map(function (c) { return '<li><b>' + esc(c.kind) + '</b> · ' + esc(c.text) + ' <span class="muted">(זוהה <bdi class="mono">' + esc(stamp(c.detected_at)) + '</bdi>)</span></li>'; }).join("") + '</ul>';
    if (marks.length) h += '<h2>שינויים ואירועים בשיעורים שלך</h2><ul>' + marks.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join("") + '</ul>';
    if (tab.length) h += '<h2>דף השינויים של הכיתות שלך</h2><ul>' + tab.map(function (m) { return '<li>' + esc(m) + '</li>'; }).join("") + '</ul>';
    el.innerHTML = h + '</div>';
  })();

  // ---- merge back-to-back periods of the same lesson into one block
  function blocks(list) {
    var out = [];
    list.forEach(function (l) {
      var prev = out[out.length - 1];
      if (prev && prev.subject === l.subject && prev.classes.join() === l.classes.join() && prev.status === l.status && prev.lastHour + 1 === l.hour) {
        prev.lastHour = l.hour; prev.end = l.end;
        l.co_teachers.forEach(function (c) { if (!prev.co_teachers.some(function (p) { return p.name === c.name; })) prev.co_teachers.push(c); });
        l.changes.forEach(function (c) { if (!prev.changes.some(function (p) { return p.text === c.text; })) prev.changes.push(c); });
        l.other_lessons.forEach(function (o) { if (!prev.other_lessons.some(function (p) { return p.subject === o.subject && p.teacher === o.teacher; })) prev.other_lessons.push(o); });
        return;
      }
      out.push(Object.assign({}, l, { firstHour: l.hour, lastHour: l.hour, co_teachers: l.co_teachers.slice(), changes: l.changes.slice(), other_lessons: l.other_lessons.slice() }));
    });
    return out;
  }

  function card(b) {
    var per = b.firstHour === b.lastHour ? "שעה " + b.firstHour : "שעות " + range(b.firstHour, b.lastHour);
    var off = b.status === "cancelled";
    var h = '<article class="lesson' + (off ? " cancelled" : b.changes.length ? " changed" : "") + '">';
    h += '<div class="when"><span class="per">' + per + '</span>' + (off ? '<span class="off-tag">לא מתקיים</span>' : "") + '<span class="t">' + esc(b.start) + '</span><span class="t2">עד ' + esc(b.end) + '</span></div>';
    h += '<div class="what"><h3>' + esc(b.subject) + '</h3>';
    agendaHits(b).filter(function (a) { return !b.changes.some(function (c) { return c.text.trim() === a.title.trim(); }); }).forEach(function (a) {
      h += '<div class="change"><b>' + esc(a.kind) + '</b><span>' + esc(a.title) + '</span></div>';
    });
    if (off && !b.changes.length) h += '<div class="change bad"><b>לא מתקיים</b><span>השיעור הוסר מהמערכת השבוע</span></div>';
    b.changes.forEach(function (c) {
      h += '<div class="change' + (off || BAD.test(c.type + c.text) ? " bad" : "") + '"><b>' + esc(c.type) + '</b><span>' + esc(c.text) + '</span></div>';
    });
    h += '<div class="row"><span class="label">כיתה</span>' + b.classes.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join("") + '</div>';
    if (b.rooms.length) h += '<div class="row"><span class="label">חדר</span>' + b.rooms.map(function (r) { return '<span class="chip plain">' + esc(r) + '</span>'; }).join("") + '</div>';
    if (b.co_teachers.length) h += '<div class="row"><span class="label">מלמדים איתך</span>' + b.co_teachers.map(function (c) { return '<span class="chip plain">' + esc(c.name) + (c.room ? ' <span class="rm">· ' + esc(c.room) + '</span>' : "") + '</span>'; }).join("") + '</div>';
    else h += '<div class="row"><span class="label">מלמדים איתך</span><span class="muted">לבד</span></div>';
    if (b.other_lessons.length) h += '<details><summary>במקביל בכיתה (' + b.other_lessons.length + ')</summary><ul>' + b.other_lessons.map(function (o) { return '<li>' + esc(o.subject) + (o.room ? " (" + esc(o.room) + ")" : "") + " — " + esc(o.teacher) + '</li>'; }).join("") + '</ul></details>';
    return h + '</div></article>';
  }

  // ---- exams and events
  var AG = L.agenda || [];
  function agendaHits(b) {
    return AG.filter(function (a) {
      return a.date === b.date && a.my_lessons.some(function (h) { return h >= b.firstHour && h <= b.lastHour; });
    });
  }
  function agItem(a, withDate) {
    var hrs = a.hours ? (a.hours[0] === a.hours[1] ? "שיעור " + a.hours[0] : "שיעורים " + range(a.hours[0], a.hours[1])) : "";
    return '<div class="ag' + (a.my_lessons.length ? " hit" : "") + '"><div class="top"><span class="kind' + (a.kind === "מבחן" ? " exam" : "") + '">' + esc(a.kind) + '</span><b>' + esc(a.title) + '</b>' +
      (withDate ? '<span class="mono muted">' + dm(a.date) + '</span>' : "") + (hrs ? '<span class="muted">' + hrs + '</span>' : "") + '</div>' +
      '<div class="muted">הכיתות שלך: ' + esc(a.my_classes.join(", ")) + '</div>' +
      (a.my_lessons.length ? '<div class="hitline">נופל על שיעור שלך: ' + (a.my_lessons.length > 1 ? "שעות " : "שעה ") + a.my_lessons.join(", ") + '</div>' : "") + '</div>';
  }
  function renderAgenda() {
    var up = AG.filter(function (a) { return a.date >= todayISO; });
    var h = "", last = "";
    up.forEach(function (a) {
      if (a.date !== last) { var d = new Date(a.date + "T12:00:00"); h += '<div class="daydate">' + esc(new Intl.DateTimeFormat("he-IL", { weekday: "long", day: "2-digit", month: "2-digit" }).format(d)) + '</div>'; last = a.date; }
      h += agItem(a, false);
    });
    document.getElementById("agenda").innerHTML = h || '<div class="empty">אין מבחנים או אירועים קרובים בכיתות שלך.</div>';
  }

  // ---- now / next
  function clock() { return new Intl.DateTimeFormat("en-GB", { timeZone: "Asia/Jerusalem", hour: "2-digit", minute: "2-digit", hour12: false }).format(new Date()); }
  function mins(t) { var p = t.split(":"); return +p[0] * 60 + +p[1]; }
  function slotHtml(k, b) {
    var co = b.co_teachers.map(function (c) { return c.name; }).join(", ");
    return '<div class="slot"><span class="k">' + esc(k) + '</span><span class="s">' + esc(b.subject) + '</span><span class="d">' +
      esc(b.classes.join(", ")) + (b.rooms.length ? " · " + esc(b.rooms.join(", ")) : "") + " · " + range(b.start, b.end) +
      (co ? '<br>עם ' + esc(co) : "") + '</span></div>';
  }
  function renderNow() {
    var today = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Jerusalem" }).format(new Date());
    var t = clock(), bl = blocks(active(lessons.filter(function (l) { return l.date === today; })));
    var cur = bl.filter(function (b) { return b.start <= t && t < b.end; })[0];
    var next = bl.filter(function (b) { return b.start > t; })[0];
    var h = "";
    if (cur) h += slotHtml("עכשיו · עד " + cur.end, cur);
    if (next) {
      var m = mins(next.start) - mins(t);
      h += slotHtml("הבא · בעוד " + (m >= 60 ? Math.floor(m / 60) + " ש׳ " + (m % 60) + " דק׳" : m + " דק׳"), next);
    } else {
      var later = active(lessons).filter(function (l) { return l.date > today; })[0];
      if (later) {
        var first = blocks(active(lessons.filter(function (l) { return l.date === later.date; })))[0], dd = dayMap[later.date];
        h += slotHtml("השיעור הבא · " + (dd ? dd.weekday : "") + " " + dm(later.date), first);
      }
    }
    var el = document.getElementById("now");
    el.innerHTML = h ? '<div class="now">' + h + '</div>' : "";
  }

  // ---- day view
  var dayMap = {}; L.days.forEach(function (d) { dayMap[d.date] = d; });
  function lessonsOn(date) { return lessons.filter(function (l) { return l.date === date; }); }
  function active(list) { return list.filter(function (l) { return l.status !== "cancelled"; }); }
  function pickDefault() {
    var ds = L.days.map(function (d) { return d.date; });
    var start = hourNow >= 17 ? ds.filter(function (d) { return d > todayISO; }) : ds.filter(function (d) { return d >= todayISO; });
    for (var i = 0; i < start.length; i++) if (active(lessonsOn(start[i])).length) return start[i];
    return ds.indexOf(todayISO) >= 0 ? todayISO : ds[0];
  }
  var selected = pickDefault();
  function renderStrip() {
    var h = "", lastWeek = null;
    L.days.forEach(function (d) {
      var n = active(lessonsOn(d.date)).length;
      var wk = Math.floor((new Date(d.date) - new Date(L.days[0].date)) / (7 * 864e5));
      if (lastWeek !== null && wk !== lastWeek) h += '<span class="gap" aria-hidden="true"></span>';
      lastWeek = wk;
      var cls = (d.date === todayISO ? "today " : "") + (n ? "" : "off") + (d.date < todayISO ? " off" : "");
      h += '<button type="button" class="' + cls + '" data-date="' + d.date + '" aria-pressed="' + (d.date === selected) + '"><span class="wd">' + esc(d.weekday.replace("יום ", "")) + '</span><span class="dm">' + dm(d.date) + '</span><span class="n">' + (/חופש/.test(d.holidays.join()) ? "חופש" : (n ? n + " שעות" : "—") + (d.holidays.length ? " ●" : "")) + '</span></button>';
    });
    var strip = document.getElementById("strip");
    strip.innerHTML = h;
    var cur = strip.querySelector('[aria-pressed="true"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "center" });
  }
  function renderDay() {
    var d = dayMap[selected], list = lessonsOn(selected), on = active(list).length, gone = list.length - on;
    document.getElementById("daytitle").textContent = d.weekday + " " + dm(d.date) + (d.date === todayISO ? " · היום" : "");
    document.getElementById("daycount").textContent = (on ? on + " שעות הוראה" : list.length ? "אין שיעורים בפועל" : "") + (gone ? " · " + gone + " לא מתקיימות" : "");
    document.getElementById("dayholiday").innerHTML = d.holidays.map(function (x) { return '<div class="holiday">' + esc(x) + (/חופש/.test(x) ? ' — לבדוק אם יש לימודים' : '') + '</div>'; }).join("");
    var ends = (L.class_end || {})[selected] || [];
    document.getElementById("dayends").innerHTML = ends.length ? '<div class="ends"><h3>שעת סיום · שכבה ט</h3><table>' + ends.map(function (r) {
      var now = r.now, reg = r.regular, changed = reg && (!now || now.hour !== reg.hour);
      return '<tr><td>' + esc(r["class"]) + (changed ? ' <span class="diff">' + (!now ? "אין לימודים" : now.hour < reg.hour ? "מסיימים מוקדם" : "מסיימים מאוחר") + ' · בדרך כלל ' + esc(reg.end) + '</span>' : "") + '</td><td class="t">' + (now ? esc(now.end) + ' <span class="muted" style="font-weight:400">(שעה ' + now.hour + ')</span>' : "—") + '</td></tr>';
    }).join("") + '</table></div>' : "";
    // Items that land on a lesson are shown on its card; the rest give context for the day.
    var ctx = AG.filter(function (a) { return a.date === selected && !a.my_lessons.length; });
    document.getElementById("dayagenda").innerHTML = ctx.length ? '<div class="daydate">גם היום בכיתות שלך</div>' + ctx.map(function (a) { return agItem(a, false); }).join("") : "";
    document.getElementById("daylist").innerHTML = list.length ? blocks(list).map(card).join("") : '<div class="empty">אין לך שיעורים ביום הזה.</div>';
  }
  document.getElementById("strip").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-date]"); if (!b) return;
    selected = b.getAttribute("data-date"); renderStrip(); renderDay();
  });

  // ---- week view
  var weeks = [];
  L.days.forEach(function (d) {
    var wk = Math.floor((new Date(d.date) - new Date(L.days[0].date)) / (7 * 864e5));
    (weeks[wk] = weeks[wk] || []).push(d);
  });
  var weekIdx = 0;
  weeks.forEach(function (w, i) { if (w.some(function (d) { return d.date === selected; })) weekIdx = i; });
  var classes = [], teachers = [];
  lessons.forEach(function (l) {
    l.classes.forEach(function (c) { if (classes.indexOf(c) < 0) classes.push(c); });
    l.co_teachers.forEach(function (c) { if (teachers.indexOf(c.name) < 0) teachers.push(c.name); });
  });
  classes.sort(); teachers.sort();
  var fc = document.getElementById("f-class"), ft = document.getElementById("f-teacher");
  fc.innerHTML = '<option value="">הכול</option>' + classes.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join("");
  ft.innerHTML = '<option value="">הכול</option>' + teachers.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join("");
  function match(l) {
    return (!fc.value || l.classes.indexOf(fc.value) >= 0) && (!ft.value || l.co_teachers.some(function (c) { return c.name === ft.value; }));
  }
  function renderWeek() {
    document.getElementById("weeknav").innerHTML = weeks.map(function (w, i) {
      return '<button type="button" data-w="' + i + '" aria-pressed="' + (i === weekIdx) + '">' + (i === 0 ? "השבוע" : i === 1 ? "שבוע הבא" : "שבוע " + (i + 1)) + ' <span class="mono">' + dm(w[0].date) + '</span></button>';
    }).join("");
    var days = (weeks[weekIdx] || []).filter(function (d) { return lessonsOn(d.date).length || new Date(d.date).getDay() < 5; });
    var inWeek = lessons.filter(function (l) { return days.some(function (d) { return d.date === l.date; }); });
    var hours = {}; inWeek.forEach(function (l) { hours[l.hour] = l.start + "–" + l.end; });
    var hs = Object.keys(hours).map(Number).sort(function (a, b) { return a - b; });
    var shown = active(inWeek.filter(match));
    var h = '<tr><th class="h">שעה</th>' + days.map(function (d) { return '<th>' + esc(d.weekday.replace("יום ", "")) + ' <span class="mono">' + dm(d.date) + '</span>' + d.holidays.map(function (x) { return '<span class="hol">' + esc(x) + '</span>'; }).join("") + '</th>'; }).join("") + '</tr>';
    hs.forEach(function (hr) {
      h += '<tr><th class="h">' + hr + '<br><span style="font-size:.68rem">' + esc(hours[hr].split("–")[0]) + '</span></th>';
      days.forEach(function (d) {
        var all = inWeek.filter(function (l) { return l.date === d.date && l.hour === hr; });
        var here = all.filter(match);
        if (!all.length) { h += '<td></td>'; return; }
        if (!here.length) { h += '<td class="dim">' + all.map(function (l) { return esc(l.classes.join(", ")); }).join("<br>") + '</td>'; return; }
        var allOff = here.every(function (l) { return l.status === "cancelled"; });
        h += '<td class="slot' + (allOff ? " cancelled" : here.some(function (l) { return l.changes.length; }) ? " changed" : "") + '" data-date="' + d.date + '">' + here.map(function (l) { return '<span class="s">' + esc(l.subject) + '</span>' + esc(l.classes.join(", ")) + (l.status === "cancelled" ? ' <span class="off-tag">לא מתקיים</span>' : ""); }).join("<hr style='border:0;border-top:1px solid var(--line);margin:3px 0'>") + '</td>';
      });
      h += '</tr>';
    });
    document.getElementById("weekgrid").innerHTML = hs.length ? h : '<tr><td class="empty">אין שיעורים בשבוע הזה.</td></tr>';
    document.getElementById("totals").innerHTML = '<span>שעות בשבוע: <b>' + shown.length + '</b></span>' +
      '<span>ימים: <b>' + days.filter(function (d) { return shown.some(function (l) { return l.date === d.date; }); }).length + '</b></span>' +
      (fc.value || ft.value ? '<span>מסונן</span>' : "");
  }
  document.getElementById("weeknav").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-w]"); if (!b) return; weekIdx = +b.getAttribute("data-w"); renderWeek();
  });
  fc.addEventListener("change", renderWeek); ft.addEventListener("change", renderWeek);
  document.getElementById("weekgrid").addEventListener("click", function (e) {
    var td = e.target.closest("td[data-date]"); if (!td) return;
    selected = td.getAttribute("data-date"); show("day"); renderStrip(); renderDay();
  });

  // ---- journal (one entry per recorded day)
  function renderHist() {
    var hist = (DATA.history || []).filter(function (d) { return d.lessons && d.lessons.length; }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    document.getElementById("hist").innerHTML = hist.length ? hist.map(function (d) {
      return '<details' + (d.date === todayISO ? " open" : "") + '><summary><span>' + esc(d.weekday) + ' <span class="mono">' + dm(d.date) + '</span>' + (d.date === todayISO ? " · היום" : d.date > todayISO ? " · מתוכנן" : "") + '</span><span class="muted">' + active(d.lessons).length + ' שעות</span></summary><ul>' +
        d.lessons.map(function (l) { return '<li><span class="mono">' + l.hour + ' · ' + esc(l.start) + '</span> ' + esc(l.subject) + ' — ' + esc(l.classes.join(", ")) + (l.co_teachers.length ? ' <span class="muted">(עם ' + esc(l.co_teachers.map(function (c) { return c.name; }).join(", ")) + ')</span>' : "") + (l.status === "cancelled" ? ' <b style="color:var(--bad)">לא התקיים</b>' : "") + (l.changes.length ? ' <b style="color:var(--warn)">' + esc(l.changes.map(function (c) { return c.type; }).join(", ")) + '</b>' : "") + '</li>'; }).join("") +
        '</ul></details>';
    }).join("") : '<div class="empty">היומן יתמלא אחרי הבדיקות היומיות.</div>';
  }

  // ---- tabs
  function show(view) {
    ["day", "week", "agenda", "hist"].forEach(function (v) {
      document.getElementById("view-" + v).hidden = v !== view;
      document.getElementById("tab-" + v).setAttribute("aria-selected", String(v === view));
    });
    store("view", view);
    if (view === "week") renderWeek();
    if (view === "hist") renderHist();
    if (view === "agenda") renderAgenda();
  }
  document.querySelector(".tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-view]"); if (b) show(b.getAttribute("data-view"));
  });

  renderStrip(); renderDay(); renderNow();
  setInterval(renderNow, 60000);
  var saved = store("view");
  if (saved === "week" || saved === "hist" || saved === "agenda") show(saved);
})();
</script>
